# Opt-in template. The consuming pipeline must define HARNESS_ROOT and a test stage.
harness:check:
  stage: test
  image: node:22-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - test -n "$HARNESS_ROOT"
    - node "$HARNESS_ROOT/bin/aih.js" check --target "$CI_PROJECT_DIR"
