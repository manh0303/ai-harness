name: Publish npm package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure release commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for Trusted Publishing
        run: npm install --global 'npm@^11'
      - name: Validate version, tag and scope
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== "v" + pkg.version) throw new Error("Release tag and version mismatch");
            if (pkg.name !== "@manhd_d/ai-harness") throw new Error("Unexpected package scope");
            if (pkg.publishConfig?.access !== "public") throw new Error("Expected public package");
          '
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify before publishing
        run: |
          npm test
          npm run validate
          npm run check:release
          npm run test:package
          npm pack --dry-run
      - name: Publish with npm OIDC
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: 'false'
