{
  "schema_version": 1,
  "checks": [
    {
      "id": "typecheck",
      "title": "Configured type check",
      "command": [
        "<package-manager>",
        "run",
        "typecheck"
      ],
      "when_file": "package.json",
      "evidence": [
        "Actual package script and exit status"
      ],
      "execution": "advisory"
    },
    {
      "id": "test",
      "title": "Component and flow tests",
      "command": [
        "<package-manager>",
        "run",
        "test"
      ],
      "when_file": "package.json",
      "evidence": [
        "Visible UI state assertions",
        "Keyboard and critical browser flow evidence"
      ],
      "execution": "advisory"
    },
    {
      "id": "build",
      "title": "Production build",
      "command": [
        "<package-manager>",
        "run",
        "build"
      ],
      "when_file": "package.json",
      "evidence": [
        "Actual build output",
        "SSR/hydration checks when applicable"
      ],
      "execution": "advisory"
    },
    {
      "id": "convention-fit",
      "title": "Review project convention, reuse and module boundary fit",
      "command": [],
      "when_file": null,
      "evidence": [
        "Applicable convention sources and comparable implementation paths",
        "Reused public symbols and rationale for new components or dependencies",
        "Configured lint/type/build/test and boundary results, or explicit manual review limits"
      ],
      "execution": "manual"
    },
    {
      "id": "feature-slice",
      "title": "Review route/screen, data/state and existing public API fit",
      "command": [],
      "when_file": null,
      "evidence": [
        "AC to route/screen, interaction and API/state mapping",
        "Reused component/client/form/router APIs and justified new code",
        "Validation, loading/error/pending states and stale/account response handling"
      ],
      "execution": "manual"
    },
    {
      "id": "behavior-evidence",
      "title": "Review actual behavior checks and environment limits",
      "command": [],
      "when_file": null,
      "evidence": [
        "AC-linked component/integration results and simulated boundaries",
        "Actual browser/server evidence or explicit blocked checks",
        "Confirmed scripts, actual results and owner for unavailable checks"
      ],
      "execution": "manual"
    },
    {
      "id": "engineering-depth",
      "title": "Risk-selected engineering and document integrity review",
      "command": [],
      "when_file": null,
      "evidence": [
        "Inspected revision, conventions, reuse and vertical slice with observable done condition",
        "Relevant invariant/contract/compatibility risks mapped to actual scenarios and real/mocked evidence",
        "Canonical document/ADR facts and proposals reconciled; render/device/export gaps explicitly NOT_RUN or BLOCKED"
      ],
      "execution": "manual"
    }
  ]
}
