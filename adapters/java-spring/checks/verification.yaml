{
  "schema_version": 1,
  "checks": [
    {
      "id": "maven",
      "title": "Maven wrapper verification",
      "command": [
        "./mvnw",
        "verify"
      ],
      "when_file": "mvnw",
      "evidence": [
        "Unit and integration test results",
        "Authorization and transaction failure cases"
      ],
      "execution": "advisory"
    },
    {
      "id": "gradle",
      "title": "Gradle wrapper verification",
      "command": [
        "./gradlew",
        "check"
      ],
      "when_file": "gradlew",
      "evidence": [
        "Executed task list and test results",
        "Database integration test status"
      ],
      "execution": "advisory"
    },
    {
      "id": "convention-fit",
      "title": "Review project convention, reuse and module boundary fit",
      "command": [],
      "when_file": null,
      "evidence": [
        "Applicable convention sources and comparable implementation paths",
        "Reused public symbols and rationale for new components or dependencies",
        "Configured lint/type/build/test and boundary results, or explicit manual review limits"
      ],
      "execution": "manual"
    }
  ]
}
